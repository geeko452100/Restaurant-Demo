<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Rhythm & Brews - Owner Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="demo-disclaimer">Interactive Website Concept created by Prairie Web Studio. This is an independent design proposal and is not the official website for Rhythm &amp; Brews.</div>
<header class="topbar">
  <a href="../index.html" class="topbar-logo">
    <img src="../assets/rhythm_brews.webp" alt="Rhythm & Brews" />
  </a>
  <a href="../index.html" class="ghost-btn">Back to Site</a>
</header>

<main>
  <section class="card">
    <h2>Sign In</h2>
    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit">Sign In</button>
      <div class="status-msg" id="login-status"></div>
    </form>
  </section>
</main>

<script src="../js/admin-login.js"></script>
</body>
</html>
