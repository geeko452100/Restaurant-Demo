name = "rhythm-and-brews-demo"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
# The Worker only needs to run for /api/*; every other request that
# matches a static file is served directly by Cloudflare's asset layer.
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "rhythm-and-brews-db"
# Replace with the ID printed by `wrangler d1 create rhythm-and-brews-db`.
database_id = "5f1e3364-9c04-475d-a59c-f0fb402e571c"
migrations_dir = "drizzle/migrations"

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
# Any unique positive integer, distinct per binding within this account.
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "PUBLIC_FORM_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

[observability]
enabled = true

[triggers]
# Cosmetic "servings remaining" auto-decrement (see the `scheduled`
# handler in src/index.ts) — every 20 minutes.
crons = ["*/20 * * * *"]
